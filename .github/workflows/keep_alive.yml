name: Keep Streamlit Apps Awake

on:
  schedule:
    # Runs every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Ping All Three Streamlit Dashboards
        run: |
          echo "Pinging Leptospirosis App..."
          curl -s -o /dev/null -w "%{http_code}\n" https://leptospirosis-db-new-jdtweyoy6hnhyih9cgladw.streamlit.app/

          echo "Pinging Dengue App..."
          curl -s -o /dev/null -w "%{http_code}\n" https://dengue-dashboard-tpafnlgx8tctolm5ppvqs9.streamlit.app/

          echo "Pinging General App..."
          curl -s -o /dev/null -w "%{http_code}\n" https://zpvarja6uvntcfmu5uqkx4.streamlit.app/
